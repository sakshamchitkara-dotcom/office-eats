[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-eats"
version = "0.5.0"
description = "Find the best places to eat near an office: team lunches, client dinners, catering, coffee."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
tz = ["timezonefinder>=6"]
dev = ["pytest>=8"]

[project.scripts]
office-eats = "office_eats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
